<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CDライブラリ</title>
<script src="https://unpkg.com/@zxing/browser@latest"></script>
<style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f7f7fb;color:#202124;margin:0;padding:24px 18px 80px;max-width:850px;margin:auto}header,.row{display:flex;gap:10px;align-items:center}header{justify-content:space-between}h1{margin:0;font-size:30px}.muted{color:#777}.btn{border:1px solid #d5d7dd;background:#fff;border-radius:22px;padding:12px 16px;font-size:17px;color:#1677ff}.primary{background:#202124;color:#fff;border-color:#202124;font-weight:700}input,textarea{width:100%;padding:15px;border:1px solid #d5d7dd;border-radius:18px;font-size:17px;background:#fff}textarea{min-height:140px}.search{margin:22px 0 14px}.tabs{display:flex;gap:8px;overflow:auto}.card{background:#fff;border:1px solid #dedfe4;border-radius:22px;padding:18px;margin:14px 0}.hidden{display:none!important}.grow{flex:1}label{display:block;font-weight:700;margin:18px 0 8px}.notice{padding:12px;border-radius:14px;background:#f1f2f4;margin:12px 0}.error{color:#b42318}.album{display:flex;gap:14px}.cover{width:88px;height:88px;object-fit:cover;border-radius:12px;background:#eee}.tracks{padding-left:22px}#scanner{position:fixed;inset:0;background:#000;z-index:99}#video{width:100%;height:calc(100% - 90px);object-fit:cover}.scanbar{height:90px;background:#111;color:#fff;display:flex;align-items:center;justify-content:space-around;padding:10px}</style></head>
<body><header><div><h1>CDライブラリ</h1><div id="stats" class="muted"></div></div><button id="open" class="btn primary">＋ CDを登録</button></header>
<input id="search" class="search" placeholder="曲名・アーティスト・CD名で検索"><div class="tabs"><button class="btn primary tab" data-m="cd">CD一覧</button><button class="btn tab" data-m="artist">アーティスト一覧</button><button class="btn tab" data-m="track">曲一覧</button></div><div id="list"></div>
<section id="form" class="card hidden"><div class="row"><h2 class="grow">CDを登録</h2><button id="close" class="btn">閉じる</button></div>
<label>JAN / バーコード</label><div class="row"><input id="barcode" class="grow" inputmode="numeric" placeholder="13桁のJANコード"><button id="scan" class="btn primary">カメラで読取</button></div><button id="fetch" class="btn" style="margin-top:10px">バーコードから自動取得</button><div id="msg"></div>
<label>CDタイトル</label><input id="title"><label>アーティスト</label><input id="artist"><label>発売日</label><input id="date" placeholder="YYYY-MM-DD"><label>規格品番</label><input id="catalog" placeholder="例：UPCH-7732"><label>ジャケット画像URL</label><input id="cover"><label>収録曲</label><textarea id="tracks" placeholder="1行に1曲"></textarea><button id="save" class="btn primary" style="margin-top:18px;width:100%">このCDを登録</button></section>
<div id="scanner" class="hidden"><video id="video" playsinline muted></video><div class="scanbar"><span>バーコードを中央に映してください</span><button id="stop" class="btn">キャンセル</button></div></div>
<script>
const $=s=>document.querySelector(s);let db=JSON.parse(localStorage.getItem("cdLibraryV3")||"[]"),mode="cd",ctl=null;
const known={"4988031764855":{title:"BLAST（初回限定メンバーソロ盤 NAOYA Ver.）",artist:"ONE N' ONLY",date:"2025-06-18",catalog:"UPCH-7732",tracks:["BLAST","Bittersweet","BOOM BASH"]}};
const esc=s=>String(s||"").replace(/[&<>"]/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[x]));
function persist(){localStorage.setItem("cdLibraryV3",JSON.stringify(db));render()}
function render(){let q=$("#search").value.toLowerCase(),a=db.filter(x=>[x.title,x.artist,...x.tracks].join(" ").toLowerCase().includes(q));$("#stats").textContent=`${new Set(db.map(x=>x.artist)).size}組・${db.length}枚・${db.reduce((n,x)=>n+x.tracks.length,0)}曲`;
if(mode==="track"){let t=[];a.forEach(x=>x.tracks.forEach(y=>t.push(`<div class="card"><b>${esc(y)}</b><div>${esc(x.artist)}</div><div class="muted">収録CD：${esc(x.title)}</div></div>`)));$("#list").innerHTML=t.join("")||'<div class="card">該当なし</div>';return}
if(mode==="artist"){let n=[...new Set(a.map(x=>x.artist))];$("#list").innerHTML=n.map(x=>`<div class="card"><b>${esc(x)}</b><div class="muted">${a.filter(y=>y.artist===x).length}枚</div></div>`).join("")||'<div class="card">該当なし</div>';return}
$("#list").innerHTML=a.map(x=>`<div class="card album">${x.cover?`<img class="cover" loading="lazy" decoding="async" src="${esc(x.cover)}">`:'<div class="cover"></div>'}<div><b>${esc(x.title)}</b><div>${esc(x.artist)}</div><div class="muted">${esc(x.date)} ${esc(x.catalog)}</div><ol class="tracks">${x.tracks.map(y=>`<li>${esc(y)}</li>`).join("")}</ol><button class="btn" onclick="del('${x.id}')">削除</button></div></div>`).join("")||'<div class="card"><b>まだCDが登録されていません</b></div>'}
window.del=id=>{if(confirm("削除しますか？")){db=db.filter(x=>x.id!==id);persist()}}
function fill(d){["title","artist","date","catalog","cover"].forEach(k=>$("#"+k).value=d[k]||"");$("#tracks").value=(d.tracks||[]).join("\n")}
async function musicbrainz(code){let r=await fetch(`https://musicbrainz.org/ws/2/release/?query=barcode:${code}&fmt=json&limit=1`),j=await r.json();if(!j.releases?.length)return null;let id=j.releases[0].id;await new Promise(r=>setTimeout(r,1100));let d=await fetch(`https://musicbrainz.org/ws/2/release/${id}?inc=recordings+artist-credits+labels&fmt=json`).then(r=>r.json());return{title:d.title,artist:(d["artist-credit"]||[]).map(x=>x.name).join(""),date:d.date||"",catalog:d["label-info"]?.[0]?.["catalog-number"]||"",cover:`https://coverartarchive.org/release/${id}/front-500`,tracks:(d.media||[]).flatMap(m=>(m.tracks||[]).map(t=>t.title))}}
async function lookup(){let c=$("#barcode").value.replace(/\D/g,"");$("#barcode").value=c;if(!c)return;$("#msg").innerHTML='<div class="notice">検索中…</div>';try{let d=await musicbrainz(c)||known[c];if(d){fill(d);$("#msg").innerHTML='<div class="notice">見つかりました。内容を確認して登録してください。</div>'}else $("#msg").innerHTML='<div class="notice error">MusicBrainzでは見つかりませんでした。手入力でも登録できます。</div>'}catch(e){let d=known[c];if(d){fill(d);$("#msg").innerHTML='<div class="notice">情報を取得しました。</div>'}else $("#msg").innerHTML='<div class="notice error">通信エラーです。</div>'}}
function stop(){try{ctl?.stop()}catch(e){}ctl=null;$("#video").srcObject?.getTracks().forEach(t=>t.stop());$("#scanner").classList.add("hidden")}
async function scan(){if(!navigator.mediaDevices?.getUserMedia){alert("Safariで開いてください");return}$("#scanner").classList.remove("hidden");try{
let r=new ZXingBrowser.BrowserMultiFormatReader();
ctl=await r.decodeFromConstraints({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false},$("#video"),async(res)=>{
 if(res){
  let c=res.getText().replace(/\D/g,"");
  if(c.length===13){$("#barcode").value=c;stop();lookup()}
 }
});
try{
 let stream=$("#video").srcObject,track=stream&&stream.getVideoTracks()[0];
 let caps=track&&track.getCapabilities?track.getCapabilities():{};
 let advanced={};
 if(caps.focusMode&&caps.focusMode.includes("continuous"))advanced.focusMode="continuous";
 if(caps.zoom){
   let min=caps.zoom.min||1,max=caps.zoom.max||1;
   advanced.zoom=Math.min(max,Math.max(min,1.5));
 }
 if(Object.keys(advanced).length)await track.applyConstraints({advanced:[advanced]});
}catch(e){}
}catch(e){stop();alert("カメラを開始できません。Safariのカメラ許可を確認してください。")}}
$("#open").onclick=()=>{$("#form").classList.remove("hidden");$("#form").scrollIntoView({behavior:"smooth"})};$("#close").onclick=()=>$("#form").classList.add("hidden");$("#fetch").onclick=lookup;$("#scan").onclick=scan;$("#stop").onclick=stop;
$("#save").onclick=()=>{if(!$("#title").value.trim())return alert("CDタイトルを入力してください");db.unshift({id:Date.now()+"",barcode:$("#barcode").value,title:$("#title").value,artist:$("#artist").value,date:$("#date").value,catalog:$("#catalog").value,cover:$("#cover").value,tracks:$("#tracks").value.split("\n").map(x=>x.trim()).filter(Boolean)});persist();$("#form").classList.add("hidden");window.scrollTo(0,0)}
$("#search").oninput=render;document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("primary",x===b));render()});render();
</script></body></html>
